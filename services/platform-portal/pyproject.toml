[project]
name = "platform-portal"
version = "0.1.1"
description = "One page listing every app in the cluster, with live health"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_portal"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
