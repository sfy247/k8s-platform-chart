[project]
name = "hello-python"
version = "0.1.0"
description = "Hello-world service for the local Kubernetes lab"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",      # FastAPI's TestClient needs it
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_python"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
