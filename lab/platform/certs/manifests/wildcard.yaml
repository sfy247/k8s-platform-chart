# ─────────────────────────────────────────────────────────────────────────
# One wildcard certificate covering every lab hostname.
#
# ingress-nginx serves this as its DEFAULT certificate, which is what makes
# future apps work with no configuration at all: any Ingress on a
# *.localtest.me host is served this certificate automatically, whether or
# not it declares a `tls:` block.
#
# An app that wants its own certificate can still request one by annotating
# its Ingress with `cert-manager.io/cluster-issuer: lab-ca`.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: ingress-nginx
spec:
  secretName: lab-wildcard-tls
  # 90 days with automatic renewal at 30 — short enough that a broken
  # renewal surfaces while it is still harmless.
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    # A wildcard matches ONE label, so *.localtest.me covers
    # grafana.localtest.me but not a.b.localtest.me. Every lab host is a
    # single label, and the bare domain is listed for completeness.
    - "*.localtest.me"
    - "localtest.me"
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
    group: cert-manager.io
