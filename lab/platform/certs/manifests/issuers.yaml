# ─────────────────────────────────────────────────────────────────────────
# The lab's certificate chain, in three steps.
#
#   selfsigned-bootstrap  ──signs──>  lab-root-ca  ──signs──>  every app cert
#
# Only the root CA needs to be trusted by a browser. Trust it once and every
# certificate the lab issues — today's apps and every future one — is
# accepted without a warning.
# ─────────────────────────────────────────────────────────────────────────

# Step 1. An issuer that signs with nothing but itself. Its only job is to
# sign the root CA below into existence.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# Step 2. The lab's root CA. This is the certificate you install into your
# browser and OS trust store.
#
# Ten years, because re-trusting a new root on every machine is manual work
# with no security benefit in a local lab. isCA plus the cert sign usages are
# what make it usable as a signing authority rather than a server cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: sfy247 lab root CA
  secretName: lab-root-ca
  duration: 87600h    # 10 years
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
    - digital signature
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
# Step 3. The issuer every application actually uses. Referencing this from
# an Ingress annotation gets a certificate that chains to the trusted root.
#
#   cert-manager.io/cluster-issuer: lab-ca
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-root-ca
