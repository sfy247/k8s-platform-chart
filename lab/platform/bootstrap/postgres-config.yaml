# The shared PostgreSQL cluster and its per-app databases.
#
# Separate from the operator's own Application: the operator installs CRDs,
# and these resources use them.
#
# ignoreDifferences below is not decoration. CloudNativePG defaults roughly
# fifty fields into the Cluster spec the moment it sees the object — image
# UIDs, WAL settings, timeouts, probes, locale. Git declares none of them,
# so without this the Application is permanently OutOfSync and genuine drift
# would be invisible in the noise. The list was generated by diffing the
# rendered manifest against the live object; regenerate it after a
# CloudNativePG upgrade, which may introduce new defaults.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-config
  namespace: argocd
  labels:
    lab.sfy247.io/layer: platform
spec:
  project: default
  source:
    repoURL: https://github.com/sfy247/k8s-platform-chart.git
    targetRevision: main
    path: lab/platform/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  ignoreDifferences:
  - group: postgresql.cnpg.io
    kind: Cluster
    name: lab-pg
    jsonPointers:
    - /spec/affinity
    - /spec/bootstrap/initdb/encoding
    - /spec/bootstrap/initdb/localeCType
    - /spec/bootstrap/initdb/localeCollate
    - /spec/enablePDB
    - /spec/enableSuperuserAccess
    - /spec/failoverDelay
    - /spec/logLevel
    - /spec/managed/roles/0/connectionLimit
    - /spec/managed/roles/0/inherit
    - /spec/maxSyncReplicas
    - /spec/minSyncReplicas
    - /spec/monitoring
    - /spec/postgresGID
    - /spec/postgresUID
    - /spec/postgresql/parameters/archive_mode
    - /spec/postgresql/parameters/archive_timeout
    - /spec/postgresql/parameters/dynamic_shared_memory_type
    - /spec/postgresql/parameters/full_page_writes
    - /spec/postgresql/parameters/log_destination
    - /spec/postgresql/parameters/log_directory
    - /spec/postgresql/parameters/log_filename
    - /spec/postgresql/parameters/log_rotation_age
    - /spec/postgresql/parameters/log_rotation_size
    - /spec/postgresql/parameters/log_truncate_on_rotation
    - /spec/postgresql/parameters/logging_collector
    - /spec/postgresql/parameters/max_parallel_workers
    - /spec/postgresql/parameters/max_replication_slots
    - /spec/postgresql/parameters/max_worker_processes
    - /spec/postgresql/parameters/shared_memory_type
    - /spec/postgresql/parameters/shared_preload_libraries
    - /spec/postgresql/parameters/ssl_max_protocol_version
    - /spec/postgresql/parameters/ssl_min_protocol_version
    - /spec/postgresql/parameters/wal_keep_size
    - /spec/postgresql/parameters/wal_level
    - /spec/postgresql/parameters/wal_log_hints
    - /spec/postgresql/parameters/wal_receiver_timeout
    - /spec/postgresql/parameters/wal_sender_timeout
    - /spec/postgresql/syncReplicaElectionConstraint
    - /spec/primaryUpdateMethod
    - /spec/probes
    - /spec/replicationSlots
    - /spec/smartShutdownTimeout
    - /spec/startDelay
    - /spec/stopDelay
    - /spec/storage/resizeInUseVolumes
    - /spec/switchoverDelay
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
