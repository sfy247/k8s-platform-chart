# ingress-nginx for the local lab.
# Exposed as a LoadBalancer Service, which k3s ServiceLB (klipper) binds to
# node ports 80/443; k3d then forwards host 8080/8443 to those.
controller:
  replicaCount: 1

  ingressClassResource:
    name: nginx
    enabled: true
    default: true          # charts that omit ingress.className still work

  service:
    type: LoadBalancer

  # Lab-sized. Requests are what the scheduler reserves; keep them honest.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  config:
    # Preserve the original client address through the k3d LB hop.
    use-forwarded-headers: "true"
    # Readable access logs while learning; drop to text/JSON as you like.
    log-format-escape-json: "true"

  # Serve the lab's wildcard certificate for every host that does not
  # request its own. This is what makes a new app secure with no
  # configuration: any *.localtest.me Ingress gets a trusted certificate
  # whether or not it declares a `tls:` block.
  #
  # Issued by cert-manager from the lab root CA — see lab/platform/certs.
  # Until that certificate exists, ingress-nginx falls back to its own
  # self-signed default, so this is safe to set before it is issued.
  extraArgs:
    default-ssl-certificate: ingress-nginx/lab-wildcard-tls

  admissionWebhooks:
    enabled: true          # rejects malformed Ingress objects at apply time

  metrics:
    enabled: true          # request rate / errors / latency per ingress host
    serviceMonitor:
      # Safe to declare: the prometheus-operator-crds Application installs the
      # ServiceMonitor CRD, and bootstrap waits for it before creating the
      # rest of the platform.
      enabled: true

defaultBackend:
  enabled: false
