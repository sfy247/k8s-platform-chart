# ─────────────────────────────────────────────────────────────────────────
# The shared lab PostgreSQL cluster.
#
# One instance serving every project, with a separate database and role per
# app. Shared infrastructure, isolated data — the same model a small
# platform team would run before anything justifies a database per service.
#
# Apps get their database by adding a Database resource next to this one;
# see databases.yaml. Credentials are generated by the operator into a
# Secret, so no password is ever written to git.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab-pg
  namespace: data
spec:
  # One instance: this is a laptop. Raise to 3 for real high availability —
  # CNPG handles replication and failover, and the change is this number.
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17.6

  storage:
    size: 5Gi

  # Survives cluster deletion only if the PVC does. See the recovery note:
  # nothing here is a substitute for backups.
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      # Lab-sized. Defaults assume a dedicated machine.
      max_connections: "100"
      shared_buffers: "128MB"
      # Log slow queries — the single most useful database signal.
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_connections: "off"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi


  # The operator creates an `app` database and role for the cluster itself.
  # Per-app databases are declared separately so one app cannot see another's
  # data by accident.
  bootstrap:
    initdb:
      database: lab
      owner: lab_admin

  # ── Per-app roles ──────────────────────────────────────────────────────
  # The role NAME is declared here in git; its PASSWORD lives in a Secret
  # created by `make db-user APP=<name>` and is never committed. That split
  # is the point: the shape of the system is reviewable, the credentials
  # are not in version control.
  #
  # Add a role here, add a Database in databases.yaml, run make db-user.
  managed:
    roles:
      - name: trading_app
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: pg-trading-credentials
