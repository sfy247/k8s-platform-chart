# Rendered by the observability-config Argo CD Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - rules/lab-app-alerts.yaml
  - monitors/loki.yaml

# Each dashboard JSON becomes a ConfigMap the Grafana sidecar imports.
# Regenerate the JSON with: python3 dashboards/generate.py
configMapGenerator:
  - name: grafana-dashboard-app-overview
    files:
      - app-overview.json=dashboards/app-overview.json
    options:
      labels: {grafana_dashboard: "1"}
      annotations: {grafana_folder: Lab}
  - name: grafana-dashboard-cluster-overview
    files:
      - cluster-overview.json=dashboards/cluster-overview.json
    options:
      labels: {grafana_dashboard: "1"}
      annotations: {grafana_folder: Lab}
  - name: grafana-dashboard-fleet
    files:
      - fleet.json=dashboards/fleet.json
    options:
      labels: {grafana_dashboard: "1"}
      annotations: {grafana_folder: Lab}
  - name: grafana-dashboard-platform-health
    files:
      - platform-health.json=dashboards/platform-health.json
    options:
      labels: {grafana_dashboard: "1"}
      annotations: {grafana_folder: Lab}

generatorOptions:
  # Stable names: the sidecar tracks ConfigMaps, and a hash suffix would
  # orphan the old dashboard on every edit.
  disableNameSuffixHash: true
