# Grafana Alloy — logs AND traces.
#
# Logs: discovers pods through the Kubernetes API and ships whatever they
# write to stdout. No per-app config, no sidecar, no code change.
#
# Traces: Beyla watches HTTP and gRPC calls with eBPF and turns them into
# spans, so every app in the cluster appears on Grafana's service map
# without being instrumented — including ones we do not build (Vaultwarden,
# podinfo, Grafana itself). Spans go to Tempo, whose metrics generator
# produces the service-graph metrics the map is drawn from.
#
# The cost of eBPF: this DaemonSet now runs privileged, in the host PID
# namespace, as root. That is a real trade — kernel-level visibility for
# every app, in exchange for a collector that could read any process's
# memory. Acceptable in a single-user lab; in a shared cluster this would
# need the capability list narrowed and a second look.
controller:
  type: daemonset
  # Beyla resolves the processes behind sockets, which needs the host's
  # process table.
  hostPID: true

alloy:
  # eBPF needs kernel access that an unprivileged container does not have.
  # k3d nodes are themselves containers, so the capability-only setup Beyla
  # documents is not enough here.
  securityContext:
    privileged: true
    runAsUser: 0
    readOnlyRootFilesystem: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  configMap:
    content: |-
      // ── Discover every pod in the cluster ─────────────────────
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // ── Turn Kubernetes metadata into Loki labels ─────────────
      // Keep this list SHORT. Every label is an index dimension in Loki;
      // high-cardinality labels (pod names change constantly) make queries
      // slow and storage expensive. Pod stays because it is genuinely
      // useful for a lab; drop it first if Loki starts struggling.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // app.kubernetes.io/instance is set by the generic-app chart, so
        // every app in apps/ is queryable by name with zero extra config.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      // ── Read container logs via the Kubernetes API ────────────
      // No hostPath mounts needed, which keeps the DaemonSet unprivileged.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.parse.receiver]
      }

      // ── Lift structured fields out of JSON logs ───────────────
      // Apps that log JSON (see services/hello-python) get a queryable
      // severity label. Plain-text logs pass through untouched.
      loki.process "parse" {
        stage.json {
          expressions = { severity = "severity" }
        }
        stage.labels {
          values = { severity = "severity" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // ── Traces: eBPF in, Tempo out ────────────────────────────
      // Beyla instruments every pod it can see. Excluded: kube-system (not
      // an application) and Alloy itself (it would trace its own exports).
      beyla.ebpf "lab" {
        attributes {
          kubernetes {
            enable       = "true"
            cluster_name = "lab"
          }
        }

        discovery {
          instrument {
            kubernetes {
              namespace = "*"
            }
          }
          exclude_instrument {
            kubernetes {
              namespace = "kube-system"
            }
          }
          // The observability stack talks to itself constantly — Prometheus
          // scrapes every pod in the cluster every 30s — and those spans
          // drown the map in edges nobody asked about while costing Tempo
          // the memory it needs for real traffic.
          exclude_instrument {
            kubernetes {
              namespace = "observability"
            }
          }
        }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      // Also open OTLP, so an app that adds an SDK later lands in the same
      // pipeline instead of needing new plumbing.
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }
