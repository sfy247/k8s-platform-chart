# Grafana Tempo — trace storage, and the metrics generator that turns spans
# into the service-graph metrics Grafana draws the service map from.
#
# Single binary mode: one pod, local disk. Right for a lab; a real
# deployment splits distributor/ingester/querier and stores blocks in S3.
#
# Traces arrive over OTLP from Alloy, which produces them with eBPF
# (see values/alloy.yaml). No application sends traces directly today, but
# the OTLP receiver is open for apps that add an SDK later.

tempo:
  retention: 48h

  # OTLP is what Alloy speaks. The chart's default Jaeger and OpenCensus
  # listeners stay: its service template dereferences those values
  # unconditionally, so nulling them crashes the render.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # The service map is metrics, not traces: the generator counts requests and
  # latency per caller→callee pair and remote-writes them to Prometheus as
  # traces_service_graph_*. Grafana's Tempo datasource then queries those.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write"

  # Generators only run for tenants that ask for them. One tenant here.
  #
  # service-graphs only. span-metrics adds a histogram per service, operation
  # and status — thousands of series that nothing in the lab queries, and the
  # memory they cost is what OOM-killed this pod the first time round.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
        # A runaway cardinality source (a service that puts IDs in span names)
        # gets dropped here instead of taking Tempo down with it.
        max_active_series: 20000

  # The chart allocates a 1 GiB memory ballast by default — a pre-Go-1.19
  # trick to keep the garbage collector from running too eagerly. It shows up
  # as a single 1073.7 MB live allocation, pushes the GC target past 2.3 GB,
  # and the container hits its memory limit before a collection ever happens.
  # Two OOM kills came from this, not from the span volume, which is ~5/s.
  memBallastSizeMbs: 0

  # The cgroup-aware replacement: tell the Go runtime the ceiling and it
  # collects to stay under it, instead of guessing from a ballast.
  extraEnv:
    - name: GOMEMLIMIT
      value: "1500MiB"

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi

# Traces on disk. Small: 48h of a lab's traffic is megabytes, and losing
# them costs nothing that Prometheus and Loki do not already hold.
persistence:
  enabled: true
  size: 5Gi

# Tempo's own metrics, scraped like every other platform component.
serviceMonitor:
  enabled: true
